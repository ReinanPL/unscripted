[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = backend
addopts =
    --cov=backend/app/rules
    --cov-report=term-missing
    --cov-fail-under=90
    -m "not eval"
markers =
    eval: avalia um agente contra Gemini real (opt-in, custa API; rodar com `pytest -m eval`)

[coverage:run]
branch = True
source = backend/app/rules
