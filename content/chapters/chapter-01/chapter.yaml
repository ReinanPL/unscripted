id: aventura-01
title: O Eco da Estrada do Norte
language: pt
chapters:
  - id: chap-01
    title: Capítulo 1 — A Taverna do Javali Pálido
    map_title: Estrada do Norte
    premise: |
      O herói chega à vila de Marevale, em rota para o reino do norte, e logo
      descobre que a estrada que leva adiante foi tomada por bandidos. Para
      seguir viagem, precisará lidar com a ameaça — sozinho, ou em aliança
      com alguém local.
    background: |
      A vila vive em silêncio assustado. O xerife morreu há duas semanas em
      uma emboscada na estrada, e desde então ninguém quis assumir o posto.
      Os bandidos são liderados por Joren "Lâmina de Junho", um ex-soldado
      da guarda real expulso por crimes nunca esclarecidos — na realidade,
      por desobedecer uma ordem injusta. Ele é metódico, brutal quando
      precisa, e treinado em emboscadas: foi a especialidade dele na guarda.
      Tem quatro homens com ele. Um deles é Caelan, filho do dono da taverna
      — entrou no grupo por dívida com Joren, hesita em violência direta,
      mas segue o líder por medo.
      O velho Grimwald, dono da Taverna do Javali Pálido, sabe quem são os
      bandidos por nome. Não revela o vínculo com Caelan facilmente; o que
      o pesa é a impotência. Ele próprio foi soldado da guarda real décadas
      atrás — percepção treinada, leitura de pessoas afiada — mas envelheceu
      e perdeu a vontade de empunhar o aço.
    starting_scene: taverna_interior
    progress_condition: |
      O jogador (a) obtém informação suficiente sobre os bandidos — nomes,
      número, local do acampamento — para tomar uma decisão informada, e
      (b) resolve a ameaça da estrada, seja pelo combate na clareira, pela
      rendição negociada, ou por outra rota criativa. Só com a clareira
      neutralizada (de qualquer forma) o capítulo avança.
    hook_next: |
      Com a estrada do norte livre, o herói retoma a viagem ao amanhecer.
      O próximo capítulo se passará no vilarejo seguinte, Pedra-Cinza, onde
      um aviso real menciona o nome "Lâmina de Junho" — e a guarda real
      tem interesse específico em quem o derrotou.
    scenes:
      - id: taverna_interior
        name: Interior da Taverna do Javali Pálido
        position: { x: 160, y: 250 }
        icon: tavern
        description: |
          A taverna é pequena, mal iluminada por velas grossas em apoios de
          ferro. O ar cheira a cera, cerveja morna e madeira úmida. Há cinco
          mesas, três delas vazias. Grimwald, um homem grande de barba grisalha
          e olhar atento, lava canecas atrás do balcão sem dizer nada quando o
          herói entra.
        read_aloud: |
          Você empurra a porta pesada da taverna. Lá dentro, o silêncio é mais
          ruidoso que conversa: os poucos clientes baixam os olhos para suas
          canecas quando você passa. Atrás do balcão, um homem grande de
          barba grisalha lava louças sem pressa — e sem olhar para você.
        present:
          - grimwald
        connections:
          - to: rua_da_praca
            description: Saída pela porta principal, de volta à rua da praça da vila.
          - to: cozinha_dos_fundos
            description: Porta de fundos atrás do balcão, leva à cozinha.

      - id: rua_da_praca
        name: Rua da Praça
        position: { x: 340, y: 250 }
        icon: square
        description: |
          A rua principal de Marevale, com casas baixas de pedra e madeira.
          Há poucos transeuntes; os que existem evitam contato visual. Um
          aviso pregado num poste oferece recompensa por informações sobre
          bandidos da estrada do norte. Mais adiante, uma estrada de terra
          batida segue para o norte, saindo da vila.
        connections:
          - to: taverna_interior
            description: Entrada da Taverna do Javali Pálido.
          - to: estrada_norte
            description: Saída norte da vila, em direção à estrada que corta a floresta.

      - id: cozinha_dos_fundos
        name: Cozinha dos Fundos
        position: { x: 160, y: 100 }
        icon: interior
        description: |
          Uma cozinha pequena com chaminé apagada e pratos limpos empilhados
          numa mesa de carvalho. Há uma porta dos fundos entreaberta que dá
          para o pátio. Sobre a mesa, um bilhete dobrado tem um símbolo
          rabiscado a carvão — uma lâmina cortando um ramo.
        read_aloud: |
          Você passa pela porta atrás do balcão. A cozinha está vazia —
          chaminé fria, pratos empilhados na pressa sobre uma mesa de
          carvalho. A porta dos fundos está entreaberta; entra uma
          corrente fria do pátio. Sobre a mesa, um bilhete dobrado: um
          símbolo rabiscado a carvão, uma lâmina cortando um ramo.
        connections:
          - to: taverna_interior
            description: Volta para o salão da taverna.

      - id: estrada_norte
        name: Estrada do Norte
        position: { x: 520, y: 250 }
        icon: road
        description: |
          A estrada de terra batida sobe suavemente em direção a uma faixa
          de floresta densa. As pegadas no chão são poucas e antigas;
          ninguém anda por aqui há dias. O ar é frio, e os pássaros estão
          em silêncio quando deveriam cantar. Cerca de uma hora de marcha
          à frente, a estrada some entre árvores grossas.
        read_aloud: |
          O vento esfria conforme você deixa Marevale para trás. A estrada
          de terra avança em direção a uma muralha verde-escura de pinheiros;
          o silêncio dos pássaros é a primeira coisa que pesa. Você está
          sozinho na estrada — e sente que isso não é casualidade.
        connections:
          - to: rua_da_praca
            description: Volta para a vila de Marevale.
          - to: clareira_dos_bandidos
            description: Adiante, depois de uma curva fechada, a estrada se abre numa clareira.

      - id: clareira_dos_bandidos
        name: Clareira dos Bandidos
        position: { x: 700, y: 250 }
        icon: clearing
        description: |
          A floresta se abre numa clareira de uns trinta passos de largura,
          atravessada pela estrada. Há marcas de fogueira no centro, uma
          carroça virada de lado servindo de barricada, e cordas penduradas
          em galhos baixos — armadilhas grosseiras. Quem chega pela estrada
          principal é visto antes de chegar perto: o terreno favorece quem
          já está dentro.
          Joren e Caelan ocupam a clareira central; os outros três bandidos
          estão fora de vista — um batedor à beira da estrada (vê quem vem),
          um flanqueador na mata norte (fecha o cerco quando o líder dá o
          sinal), e um terceiro posicionado atrás da carroça (cobre o
          centro). Por isso o `present` lista apenas Joren e Caelan: os
          demais só entram em cena quando o combate começa ou são
          detectados.
        read_aloud: |
          A estrada se abre numa clareira. No centro, restos de fogueira;
          mais adiante, uma carroça tombada. Você não vê ninguém — mas
          alguma coisa está errada. O cheiro de couro engordurado, e o
          peso de olhos que você não consegue identificar.
        present:
          - joren
          - caelan
        connections:
          - to: estrada_norte
            description: Volta pela estrada, em direção à vila.

    npcs:
      - name: grimwald
        personality: |
          Cauteloso, taciturno, observador. Fala pouco e com peso. Mede o
          interlocutor antes de responder; não cede informação sem motivo.
        motivation: |
          Proteger a vila — e proteger seu filho, que está entre os bandidos.
          Esses dois objetivos hoje estão em conflito, e isso o consome em
          silêncio.
        knowledge: |
          Sabe quem são os bandidos da estrada do norte por nome (Joren, seu
          próprio filho Caelan, e mais três). Sabe onde fica o acampamento —
          numa clareira a cerca de três horas a pé pela estrada. Sabe que
          Joren foi guarda real e foi expulso, e que Joren é metódico e
          montou armadilhas no terreno.
        hidden_state:
          trait: |
            Antigo soldado da guarda real (aposentado há vinte anos),
            percepção alta. Notará rapidamente armas escondidas, intenção
            hostil, ou mentiras pouco trabalhadas.
          notes: |
            Não revela seu próprio passado militar sem provocação direta.
            Não revela que Caelan é seu filho a menos que seja convencido —
            este é um teste SEPARADO do encontro `conversar_com_grimwald`
            (que cobre informação sobre os bandidos). Para descobrir o
            vínculo familiar: DC 20 em Persuasão com abordagem genuína
            tocando diretamente em Caelan ou família, ou descoberta indireta
            (pista da cozinha, padrão de fala, sobrenome). Não acontece
            como subproduto de pressionar por informação sobre os bandidos.
            Se o jogador descobre o vínculo, Grimwald pede que Caelan seja
            poupado, se for possível.

      - name: joren
        personality: |
          Calmo, metódico, fala pouco. Mede oponentes como mediria peças
          num tabuleiro. Não grita, não ameaça — decide. Sob pressão, vira
          brutal sem cerimônia. Tem um sotaque do norte que lembra os
          oficiais de guarnição.
        motivation: |
          Sobreviver, manter seu grupo coeso e cobrar do reino que o expulsou.
          Não rouba por prazer; rouba porque foi expulso de tudo o mais.
          Não cederá a ameaças — só a uma razão prática (acordo, troca,
          retirada honrosa).
        knowledge: |
          Conhece a estrada palmo a palmo. Sabe que o herói está na vila —
          tem um batedor mantendo olho em Marevale. Não sabe quem é o
          herói nem por que está aqui. Sabe que Caelan é filho de Grimwald
          e que isso é alavanca.
        hidden_state:
          trait: |
            Ex-sargento de guarda real, especialista em emboscadas.
            Percepção treinada (DC 18 para enganá-lo com furtividade ou
            mentira). Reage instantaneamente a som metálico, movimento
            errático, ou cheiro de aço recém-empunhado. Em combate aberto,
            é defensivo — busca o ferimento que tira o oponente do ritmo,
            não o golpe heroico.
          notes: |
            Se o jogador tenta emboscar pela estrada principal: Joren já
            tem batedor; o teste de Furtividade é Difícil (DC 18). Se o
            jogador tenta por flanco (contornando pela floresta): DC 15.
            Se tenta com vantagem clara (informação prévia, dispersão dos
            bandidos por outro meio): pode cair para DC 12 ou virar sucesso
            automático.
            Joren considera render-se se: o herói neutraliza pelo menos
            dois dos bandidos sem matar Caelan, OU oferece um acordo
            concreto (passagem livre, dinheiro, intercessão pela vila).

      - name: caelan
        personality: |
          Jovem, tenso, fala em ímpetos. Hesita antes de cada golpe — algo
          no rosto trai vergonha. Sob pressão, segue Joren por medo, não
          convicção. Se tratado com humanidade, baixa a guarda.
        motivation: |
          Pagar a dívida com Joren e voltar para casa. Não se vê como
          bandido, mas como alguém preso a uma escolha errada feita há um
          ano. Quer sair vivo desta, idealmente sem que o pai saiba do que
          ele virou.
        knowledge: |
          Sabe que o pai não sabe que ele está aqui — ou pelo menos é o
          que ele acha. Sabe das armadilhas do acampamento. Não sabe que
          Joren o usaria como moeda de troca se precisasse.
        hidden_state:
          trait: |
            Hesitante em combate. Em rolagens de combate contra ele,
            considera-se que ele luta em desvantagem se o herói menciona
            o pai dele de forma genuína (dis:1d20 nas rolagens dele).
            Persuasão para fazê-lo render-se: DC 15 com qualquer abordagem
            respeitosa; DC 12 se o herói menciona Grimwald.
          notes: |
            Se reconhece o herói como alguém vindo da taverna do pai,
            empalidece. Pode tentar avisar Joren — mas hesita.

    encounters:
      - id: conversar_com_grimwald
        kind: social
        trigger: |
          Quando o jogador aborda Grimwald no balcão ou tenta puxar conversa.
        description: |
          Grimwald responde com cortesia mínima. Este encontro cobre apenas
          o teste de informação sobre os BANDIDOS — o líder, o número, o
          acampamento, as armadilhas. Para extrair essa informação:
          Persuasão DC 15 se a abordagem é direta e respeitosa; Persuasão
          DC 20 se o jogador pressiona, ameaça ou tenta intimidar.
          O vínculo familiar com Caelan é um teste SEPARADO (DC 20,
          descrito no hidden_state de Grimwald) — não confundir com esta
          rolagem. Mesmo passando neste DC, o vínculo não é revelado a
          menos que o jogador toque diretamente no assunto.
        consequences_success: |
          Grimwald revela: o líder é Joren "Lâmina de Junho", ex-guarda real.
          O acampamento fica numa clareira a três horas a pé pela estrada do
          norte. Há cinco bandidos no total. Há armadilhas no terreno —
          cordas, carroças usadas como barricada. Sob mais conversa, pode
          revelar que Joren foi soldado treinado em emboscadas.
        consequences_failure: |
          Grimwald fecha-se completamente e devolve o copo do herói pelo
          balcão. "A casa vai pagar essa. Boa noite." A fonte fica
          esgotada — sem mais informação dele neste capítulo.

      - id: emboscada_clareira
        kind: combat
        trigger: |
          Quando o jogador chega à clareira_dos_bandidos pela estrada
          principal e decide atacar, surpreender, ou se aproximar com hostilidade
          clara. Se chegar negociando, dispara o encontro social paralelo
          (mesma cena, outra abordagem — o Game Master arbitra).
        description: |
          Encontro-padrão estilo emboscada (PRD §5). O jogador tenta agir
          contra Joren e os bandidos. Joren tem estado oculto relevante:
          é ex-guarda real treinado em emboscadas, percepção alta, batedor
          a postos. A clareira tem armadilhas e cobertura favoráveis a quem
          já está dentro.

          Para uma tentativa de emboscar Joren pela estrada principal:
          rolagem de Furtividade contra dificuldade DC 18 (alta — ele é
          veterano e tem batedor). Pelo flanco pela floresta: DC 15. Com
          vantagem prévia clara (informação obtida de Grimwald + abordagem
          cuidadosa): DC 12, ou sucesso automático conforme arbitragem do
          Árbitro.

          Em combate direto sem furtividade, Joren reage primeiro e busca
          ferimento incapacitante (não letal por padrão — ele prefere
          render o oponente). Caelan luta em desvantagem se o herói invocar
          a relação com Grimwald durante o confronto.
        consequences_success: |
          O jogador surpreende Joren e neutraliza dois dos três bandidos
          fora de vista no primeiro golpe (batedor e flanqueador caem
          antes de gritar; o terceiro, atrás da carroça, hesita). Caelan
          paralisa, baixa a arma. Joren, ferido e encurralado, oferece
          rendição se a passagem pela estrada for garantida (sem
          perseguição). O bandido restante, ao ver o líder caído e Caelan
          rendido, larga a arma e some na mata norte — sem coordenação,
          sem Joren, não tenta reagir. A clareira fica livre, e o jogador
          pode optar por levar Caelan de volta para o pai, ou deixá-lo
          partir.
          Marca: events_occurred += "emboscada_clareira_vencida".
        consequences_failure: |
          O batedor de Joren vê o jogador antes do bote. Joren reage e
          rebate: o jogador sofre 1d6+2 de dano no primeiro confronto e
          é forçado a recuar pela estrada. Os bandidos não perseguem além
          da curva — Joren prefere posicionamento. O jogador pode voltar
          para Marevale, buscar nova abordagem (informação, recurso, rota),
          e tentar de novo.
          Marca: events_occurred += "emboscada_clareira_falhada".

    image_briefings:
      - id: img-taverna-interior
        scene: taverna_interior
        description: |
          Interior de taverna pequena, à noite, iluminada por velas grossas
          em apoios de ferro. Um homem grande de barba grisalha lava louças
          atrás de um balcão de madeira escura. Mesas vazias, clientes
          esparsos olhando para baixo.
        atmosphere: Silêncio pesado, tensão contida, fumaça baixa.
        style: Pintura digital com paleta escura, contraste alto entre velas e sombra.
        elements:
          - balcão de madeira lustrada
          - chaminé apagada ao fundo
          - velas em ferro
          - botas pesadas penduradas perto da porta

      - id: img-estrada-norte
        scene: estrada_norte
        description: |
          Estrada de terra batida atravessando campo aberto e subindo em
          direção a uma muralha de pinheiros densos ao fundo. Sem pessoas
          na estrada. Céu cinza-claro de fim de tarde.
        atmosphere: Isolamento, silêncio antinatural, premonição.
        style: Ilustração de fantasia, paleta fria, traço com textura.
        elements:
          - estrada de terra com sulcos antigos
          - floresta de pinheiros densa ao fundo
          - poste de madeira inclinado à beira da estrada
          - céu cinza sem pássaros

      - id: img-clareira-dos-bandidos
        scene: clareira_dos_bandidos
        description: |
          Clareira numa floresta de pinheiros, com restos de fogueira no
          centro, uma carroça tombada de lado servindo de barricada, e
          cordas penduradas em galhos baixos como armadilhas grosseiras.
          Não há figuras visíveis — só os sinais de presença humana.
        atmosphere: Calma falsa, terreno arquitetado para o bote.
        style: Ilustração de fantasia, paleta verde-escura e marrom, foco na geometria do terreno.
        elements:
          - fogueira apagada com pedras dispostas
          - carroça tombada
          - cordas em galhos baixos
          - pegadas marcando ângulos de aproximação
