# Eval set do RefereeAgent (Ruling estruturado).
#
# Cada caso descreve uma ação do jogador + contexto (state_summary,
# rules_context) e o que se espera do Ruling. Os checks são
# estruturais e tolerantes:
#   - `precisa_rolagem` exato (bool)
#   - `pericia_keywords` — pelo menos uma das palavras-chave deve
#     aparecer na perícia escolhida (case-insensitive). Não exige
#     match exato de string.
#   - `dificuldade_min` / `dificuldade_max` — faixa aceitável
#   - `consequencia_*: true` — só verifica presença (não conteúdo)

- name: emboscada_contra_veterano
  action: "Armo uma emboscada para o cavaleiro Joren na trilha estreita do bosque."
  state_summary: "Personagem: Guerreiro, HP 12/12. Localização: trilha estreita no bosque. NPCs presentes: Joren."
  rules_context: "Furtividade — esconder-se e atacar de surpresa. Em terreno favorável, vantagem na rolagem."
  hidden_note: "Joren é veterano treinado contra emboscadas, percepção alta."
  expected:
    precisa_rolagem: true
    pericia_keywords: ["furtividade", "stealth"]
    dificuldade_min: 15
    dificuldade_max: 25
    consequencia_sucesso: true
    consequencia_falha: true

- name: persuadir_taverneiro_amigo
  action: "Convenço o taverneiro a contar o que viu na noite passada — ele já me deve um favor."
  state_summary: "Personagem: Paladino, HP 14/14. Localização: taverna do Javali Pálido. NPCs presentes: Bram (taverneiro, amistoso)."
  rules_context: "Persuasão — convencer alguém disposto a ouvir."
  expected:
    precisa_rolagem: true
    pericia_keywords: ["persuasão", "persuasion"]
    dificuldade_min: 5
    dificuldade_max: 15
    consequencia_sucesso: true
    consequencia_falha: true

