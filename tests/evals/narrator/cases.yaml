# Eval set do NarratorAgent — três regressões grossas (ADR-043).
#
# Escopo deliberado: heurística sobre prosa é ruidosa por natureza,
# então não perseguimos nota alta. Pegamos só o que quebra a imersão:
#   (a) regra alucinada — narração menciona número de dado, dificuldade,
#       perícia, "rolagem", "DC", etc.
#   (b) meta-fala — agente sai do papel ("como mestre", "vou narrar",
#       "como narrador", "como assistente").
#   (c) contradição direta de lore — quando o `lore_context` afirma X,
#       narração não pode afirmar não-X.
#
# Cada caso traz `expected_forbidden` (regexes case-insensitive) e
# opcionalmente `lore_contradictions` (substrings que indicariam que
# o agente contradiz o lore).

- name: sucesso_furtividade_sem_mecanica
  action: "Armo uma emboscada para o cavaleiro Joren na trilha estreita."
  ruling:
    precisa_rolagem: true
    pericia: "Furtividade"
    dificuldade: 18
    notacao_dado: "1d20"
    motivo_dificuldade: "Joren é veterano treinado contra emboscadas"
    consequencia_sucesso:
      hp_delta: 0
      items_added: []
      items_removed: []
      new_location: null
      events_occurred: ["surpresa contra Joren"]
      objectives_completed: []
    consequencia_falha:
      hp_delta: -3
      items_added: []
      items_removed: []
      new_location: null
      events_occurred: ["Joren percebeu a emboscada"]
      objectives_completed: []
  roll_outcome:
    roll:
      notation: "1d20"
      rolls: [19]
      modifier: 0
      total: 19
      advantage: false
      disadvantage: false
    check:
      success: true
      margin: 1
      difficulty: 18
  consequence_applied:
    hp_delta: 0
    items_added: []
    items_removed: []
    new_location: null
    events_occurred: ["surpresa contra Joren"]
    objectives_completed: []
  lore_context: ""
  expected_forbidden:
    - '\b\d+d\d+\b'
    - '\brola(gem|r|ndo|i)\b'
    - '\bdado(s)?\b'
    - '\bdificuldade\b'
    - '\bDC\s*\d+'
    - '\bper[ií]cia\b'
    - '\bcr[ií]tico\b'

