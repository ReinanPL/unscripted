- name: lore_veterano_nao_pode_virar_novato
  action: "Tento encarar Joren para medir suas reações."
  ruling:
    precisa_rolagem: false
    pericia: null
    dificuldade: null
    notacao_dado: "1d20"
    motivo_dificuldade: ""
    consequencia:
      hp_delta: 0
      items_added: []
      items_removed: []
      new_location: null
      events_occurred: ["encarou Joren brevemente"]
      objectives_completed: []
  roll_outcome: null
  consequence_applied:
    hp_delta: 0
    items_added: []
    items_removed: []
    new_location: null
    events_occurred: ["encarou Joren brevemente"]
    objectives_completed: []
  lore_context: |
    Joren é um veterano de guarda. Cicatrizes nas mãos e na têmpora
    contam histórias de muitas escaramuças. Tem percepção alta e
    desconfia naturalmente de forasteiros.
  expected_forbidden:
    - '\bnovato\b'
    - '\binexperiente\b'
    - '\bjovem\s+demais\b'
    - '\bcrian[çc]a\b'
  # Quando o lore_context diz X, narração não pode dizer não-X.
  # Verificado por substring case-insensitive contra a narração final.
  lore_contradictions:
    - "Joren é jovem"
    - "Joren é inexperiente"

- name: sem_inventar_npc_quando_lore_vazio
  action: "Pergunto à pessoa mais próxima se ela viu algo estranho hoje."
  ruling:
    precisa_rolagem: false
    pericia: null
    dificuldade: null
    notacao_dado: "1d20"
    motivo_dificuldade: ""
    consequencia:
      hp_delta: 0
      items_added: []
      items_removed: []
      new_location: null
      events_occurred: ["interagiu com alguém na taverna"]
      objectives_completed: []
  roll_outcome: null
  consequence_applied:
    hp_delta: 0
    items_added: []
    items_removed: []
    new_location: null
    events_occurred: ["interagiu com alguém na taverna"]
    objectives_completed: []
  lore_context: ""
  # Não há regra rígida que NPC X não exista — só checa que não
  # inventa nome com cara de personagem novo do nada. Toleramos
  # ambiguidade narrativa ("o homem ao lado", "uma jovem servente").
  expected_forbidden:
    - '\b\d+d\d+\b'
    - '\brola(gem|r|ndo|i)\b'
    - '\bcomo (mestre|narrador|assistente|GM)\b'

